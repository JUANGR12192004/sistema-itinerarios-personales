# Configuración principal de Nginx para el API Gateway (ADR-009, ADR-036).
# Carga el módulo OTel dinámico ANTES de los bloques events{} y http{},
# que es el único lugar donde Nginx acepta load_module.
# El módulo viene en la imagen nginx:1.30.6-alpine-otel pero no se carga
# automáticamente desde la configuración por defecto de la imagen.
load_module modules/ngx_otel_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
