[pytest]
testpaths = tests

# Advertencias de terceros que el proyecto decidió filtrar (Fase 11, CLAUDE.md 9.1).
# pika 1.3.2 (ADR-021) usa datetime.utcfromtimestamp() al leer el header x-death de un mensaje
# de la DLQ. Viene de pika, no del código del proyecto; se filtra SOLO ese mensaje y SOLO cuando
# lo emite el módulo pika.data. Revisar al actualizar pika.
filterwarnings =
    ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning:pika.data
