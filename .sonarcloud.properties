# Configuración de SonarCloud (Automatic Analysis).
# SonarCloud lee este archivo de la raíz del repositorio en cada análisis automático.

# Versión de Python del proyecto (evita que analice con reglas de 3.10 a 3.14)
sonar.python.version=3.12

# Código de producción: todo lo que está en services/, menos pruebas y migraciones generadas
sonar.sources=services
sonar.exclusions=**/tests/**,**/alembic/versions/**

# Código de pruebas: solo las carpetas tests/ dentro de services/
sonar.tests=services
sonar.test.inclusions=**/tests/**
