# Configuración de SonarCloud (Automatic Analysis).
# SonarCloud lee este archivo de la raíz del repositorio en cada análisis automático.

# Versión de Python del proyecto (evita que analice con reglas de 3.10 a 3.14)
sonar.python.version=3.12

# Código de producción: los servicios (services/) y, desde la Fase 6, la función y el
# Event Trigger (serverless/), menos pruebas y migraciones generadas
sonar.sources=services,serverless,libs
sonar.exclusions=**/tests/**,**/alembic/versions/**

# Código de pruebas: solo las carpetas tests/ dentro de services/, serverless/ y, desde la
# Fase 7, gateway/ (el gateway es configuración de Nginx; solo sus pruebas son Python)
sonar.tests=services,serverless,gateway
sonar.test.inclusions=**/tests/**
