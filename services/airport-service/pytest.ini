[pytest]
# Permite importar el paquete "app" desde las pruebas sin instalarlo
pythonpath = .
testpaths = tests

# Advertencias de terceros que el proyecto decidió filtrar (Fase 11, CLAUDE.md 9.1).
# Starlette pide cambiar httpx por httpx2 en su TestClient; httpx es una librería aprobada del
# proyecto (CLAUDE.md 6) y el TestClient funciona igual. Se filtra SOLO este mensaje y SOLO de
# Starlette: cualquier otra advertencia se sigue mostrando. Revisar al actualizar FastAPI/Starlette.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
