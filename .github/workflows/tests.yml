# Integración continua: ejecuta las pruebas de cada servicio en GitHub Actions.
#
# Se ejecuta en cada pull request hacia main y en cada push a main.
# Hay un job por servicio o componente (Airport Service, Itinerary Service, desde la
# Fase 6 SendNotificationFunction y el Event Trigger, y desde la Fase 7 el API Gateway).
# Para agregar uno en una fase siguiente, copiar el job "airport-service" y cambiar su
# nombre y la carpeta (en working-directory y en cache-dependency-path).

name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura: el workflow no necesita escribir en el repositorio
permissions:
  contents: read

# Si llega un push nuevo al mismo PR o rama, se cancela la ejecución anterior
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airport-service:
    name: Airport Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/airport-service

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/airport-service/requirements.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -v

  itinerary-service:
    name: Itinerary Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/itinerary-service

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/itinerary-service/requirements.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        env:
          DATABASE_URL: postgresql+psycopg://localhost:5433/itinerary_db
        run: pytest -v

  send-notification-function:
    name: SendNotificationFunction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: serverless/send-notification-function

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            serverless/send-notification-function/requirements.txt
            serverless/send-notification-function/requirements-dev.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Sin PostgreSQL en el runner: las pruebas de integración quedan SKIPPED
      - name: Ejecutar pruebas
        env:
          DATABASE_URL: postgresql+psycopg://localhost:5434/notification_db
        run: pytest -v

      # El contexto de build es la raíz del repositorio (incluye libs/observability, Fase 9)
      - name: Construir la imagen de la función
        working-directory: ${{ github.workspace }}
        run: docker build -t send-notification-function -f serverless/send-notification-function/Dockerfile .

  event-trigger:
    name: Event Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: serverless/event-trigger

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            serverless/event-trigger/requirements.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sin RabbitMQ ni la función en el runner: las pruebas de integración quedan SKIPPED
      - name: Ejecutar pruebas
        run: pytest -v

  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      - name: Instalar dependencias de las pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Construye la imagen desde la raíz del repositorio (Fase 8: incluye frontend/).
      # En Linux host.docker.internal no existe: --add-host lo crea para que Nginx resuelva
      # la dirección de los servicios (en Docker Desktop no hace falta).
      - name: Validar la configuración de Nginx
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t api-gateway -f gateway/Dockerfile .
          docker run --rm --add-host=host.docker.internal:host-gateway api-gateway nginx -t

      # El runner tiene Docker: las pruebas aisladas levantan sus propios contenedores del
      # gateway contra servidores eco. Las pruebas smoke (gateway real) quedan SKIPPED.
      - name: Ejecutar pruebas
        run: pytest -v
