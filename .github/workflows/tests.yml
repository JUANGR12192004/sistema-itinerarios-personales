# Integración continua: ejecuta las pruebas de cada servicio en GitHub Actions.
#
# Se ejecuta en cada pull request hacia main y en cada push a main.
# Hay un job por servicio o componente (Airport Service, Itinerary Service, desde la
# Fase 6 SendNotificationFunction y el Event Trigger, y desde la Fase 7 el API Gateway).
# Desde la Fase 10, el job "Docker Compose" levanta el sistema completo y lo comprueba.
# Desde la Fase 11, el job "libs/observability" prueba el paquete compartido por separado.
# Para agregar uno en una fase siguiente, copiar el job "airport-service" y cambiar su
# nombre y la carpeta (en working-directory y en cache-dependency-path).

name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura: el workflow no necesita escribir en el repositorio
permissions:
  contents: read

# Si llega un push nuevo al mismo PR o rama, se cancela la ejecución anterior
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airport-service:
    name: Airport Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/airport-service

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/airport-service/requirements.txt
            services/airport-service/requirements-runtime.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -v

  itinerary-service:
    name: Itinerary Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/itinerary-service

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/itinerary-service/requirements.txt
            services/itinerary-service/requirements-runtime.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        env:
          DATABASE_URL: postgresql+psycopg://localhost:5433/itinerary_db
        run: pytest -v

  observability:
    name: libs/observability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: libs/observability

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/observability/requirements-dev.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Paquete compartido (ADR-040): se prueba solo, sin ningún servicio (Fase 11)
      - name: Ejecutar pruebas
        run: pytest -v

  send-notification-function:
    name: SendNotificationFunction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: serverless/send-notification-function

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            serverless/send-notification-function/requirements.txt
            serverless/send-notification-function/requirements-dev.txt
            serverless/send-notification-function/requirements-migrations.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Sin PostgreSQL en el runner: las pruebas de integración quedan SKIPPED
      - name: Ejecutar pruebas
        env:
          DATABASE_URL: postgresql+psycopg://localhost:5434/notification_db
        run: pytest -v

      # El contexto de build es la raíz del repositorio (incluye libs/observability, Fase 9)
      - name: Construir la imagen de la función
        working-directory: ${{ github.workspace }}
        run: docker build -t send-notification-function -f serverless/send-notification-function/Dockerfile .

  event-trigger:
    name: Event Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: serverless/event-trigger

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            serverless/event-trigger/requirements.txt
            serverless/event-trigger/requirements-runtime.txt
            libs/observability/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sin RabbitMQ ni la función en el runner: las pruebas de integración quedan SKIPPED
      - name: Ejecutar pruebas
        run: pytest -v

  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt

      - name: Instalar dependencias de las pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Construye la imagen desde la raíz del repositorio (Fase 8: incluye frontend/).
      # En Linux host.docker.internal no existe: --add-host lo crea para que Nginx resuelva
      # la dirección de los servicios (en Docker Desktop no hace falta).
      - name: Validar la configuración de Nginx
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t api-gateway -f gateway/Dockerfile .
          docker run --rm --add-host=host.docker.internal:host-gateway api-gateway nginx -t

      # El runner tiene Docker: las pruebas aisladas levantan sus propios contenedores del
      # gateway contra servidores eco. Las pruebas smoke (gateway real) quedan SKIPPED.
      - name: Ejecutar pruebas
        run: pytest -v

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    # Construir las seis imágenes y levantar 15 contenedores tarda unos minutos
    timeout-minutes: 25

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Detecta errores de sintaxis, anclas mal escritas o referencias a servicios inexistentes
      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      # Las imágenes instalan requirements-lock.txt (con hashes, regla S8544 de SonarCloud).
      # Si alguien cambió una versión en requirements-runtime.txt (o requirements-migrations.txt)
      # sin regenerar el lock, la imagen instalaría la versión anterior sin avisar: este paso lo detecta.
      # Usa el Python del runner (solo librería estándar, sin Docker ni red).
      - name: Comprobar que los requirements-lock.txt estén al día
        run: python3 scripts/lock_requirements.py --check

      - name: Construir las imágenes
        run: docker compose build

      - name: Levantar el sistema
        run: docker compose up -d

      # Espera hasta 3 minutos a que el gateway llegue a Itinerary Service con la base migrada.
      # GET /api/itineraries responde 200 solo si funcionan el gateway, la API, PostgreSQL y la migración.
      - name: Esperar a que el sistema esté listo
        run: |
          for url in http://localhost:8000/health http://localhost:8001/health http://localhost:8000/api/itineraries; do
            echo "Esperando $url"
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then echo "  listo"; break; fi
              if [ "$i" -eq 60 ]; then echo "  no respondió a tiempo"; exit 1; fi
              sleep 3
            done
          done

      # No se crea un itinerario real: validaría los aeropuertos contra API Colombia (internet),
      # y una falla externa haría fallar el CI sin que el sistema tenga un error.
      - name: Comprobar migraciones, colas, métricas y aislamiento
        run: |
          set -euo pipefail

          echo "1. Las dos migraciones terminaron con código 0"
          for svc in itinerary-migrations notification-migrations; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq "$svc")")
            echo "  $svc: $code"; test "$code" = "0"
          done

          echo "2. Las tablas existen"
          docker compose exec -T itinerary-postgres psql -U itinerary -d itinerary_db -tAc "SELECT count(*) FROM outbox_events"
          docker compose exec -T notification-postgres psql -U notification -d notification_db -tAc "SELECT count(*) FROM notification_history"

          echo "3. El Event Trigger declaró su cola y su DLQ (ADR-032)"
          for i in $(seq 1 30); do
            queues=$(docker compose exec -T rabbitmq rabbitmqctl list_queues -q name)
            if echo "$queues" | grep -qx "notification.itinerary-created" && echo "$queues" | grep -qx "notification.itinerary-created.dlq"; then break; fi
            if [ "$i" -eq 30 ]; then echo "$queues"; exit 1; fi
            sleep 2
          done
          echo "  colas declaradas"

          echo "4. Métricas del relay (9101) y del trigger (9102)"
          curl -fsS http://localhost:9101/ | grep -q outbox_relay_cycles_total
          curl -fsS http://localhost:9102/ | grep -q notifications_dispatched_total

          echo "5. Un error de validación de Itinerary Service pasa por el gateway sin cambios (422)"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/itineraries -H "Content-Type: application/json" -d '{}')
          echo "  $status"; test "$status" = "422"

          echo "6. Airport Service no ve la base de Itinerary Service (redes separadas)"
          if docker compose exec -T airport-service python -c "import socket; socket.create_connection(('itinerary-postgres', 5432), 2)"; then
            echo "  ERROR: airport-service llegó a itinerary-postgres"; exit 1
          fi
          echo "  aislada"

      - name: Mostrar el estado y los logs si algo falló
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80

      - name: Detener y borrar los contenedores y volúmenes
        if: always()
        run: docker compose down -v
